name: Release (fork)

# release-please reads Conventional Commits on main and keeps a release pull request open with the next
# version and CHANGELOG.md. Merging that pull request tags the release; this workflow then publishes the app
# image to this repository's GitHub Container Registry and attaches the DGX stack bundle.
# (Upstream's release.yml and publish-run-site.yml only run in stevibe/SparklingKit.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Validate the tagged source
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg poppler-utils
          npm ci
          npm run typecheck
          npm test

      # Registry names must be lower case.
      - name: Name the image
        run: printf 'IMAGE_NAME=ghcr.io/%s/sparklingkit\n' "${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=SparklingKit (fork)
            org.opencontainers.image.description=Local-first, file-oriented AI workspace
            org.opencontainers.image.licenses=Apache-2.0

      - id: build
        name: Build and publish the app image (amd64, arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ env.TAG }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
          sbom: true
          provenance: mode=max

      - uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Everything start-dgx-spark.sh needs, for installs without git.
      - name: Bundle the DGX stack
        run: |
          set -euo pipefail
          bundle="sparklingkit-dgx-stack-${VERSION}"
          mkdir -p "release-assets" "${bundle}/scripts" "${bundle}/services"
          # The app is built from source on the Spark, so the bundle carries what its Dockerfile copies.
          cp -R src package.json package-lock.json tsconfig.json tsconfig.server.json vite.config.ts Dockerfile .dockerignore "${bundle}/"
          cp compose.yaml compose.spark.yaml compose.dgx.yaml .env.example LICENSE NOTICE README.md "${bundle}/"
          cp scripts/*.sh scripts/spark-switch.env.example "${bundle}/scripts/"
          cp -R services/dgx-models services/dgx-status "${bundle}/services/"
          tar -czf "release-assets/${bundle}.tar.gz" "${bundle}"
          (cd release-assets && sha256sum ./*.tar.gz > SHA256SUMS)

      - uses: actions/attest@v4
        with:
          subject-path: release-assets/*.tar.gz

      - name: Attach the bundle to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" release-assets/* --clobber
