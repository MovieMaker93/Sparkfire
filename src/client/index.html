<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090a0c" />
    <title>SparklingKit</title>
    <script>
      // Set the theme before first paint; theme.ts keeps it in sync with Settings afterwards.
      try {
        const preference = localStorage.getItem("sparklingkit:theme") || "auto";
        const dark = preference === "dark" || (preference !== "light" && !matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
