services:
  dgx-status:
    build:
      context: ./services/dgx-status
    image: sparkfire/dgx-spark-status:0.1.0
    container_name: sparkfire-dgx-status
    restart: unless-stopped
    network_mode: host
    pid: host
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m
    environment:
      PORT: "8330"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: utility
      LLM_PORT: "8331"
      OCR_PORT: "8332"
      ASR_PORT: "8333"
      TRANSLATION_PORT: "8334"
      GROUNDING_PORT: "8335"
      IMAGE_GENERATION_PORT: "8336"
      OCR_VLM_PORT: "8342"
      # Empty with start-dgx-spark.sh --video-backend none, so the monitor does not expect the service.
      VIDEO_GENERATION_PORT: ${SPARKFIRE_VIDEO_PORT-8337}
      VIDEO_COMFY_PORT: "8347"
      MUSIC_GENERATION_PORT: "8339"
      LLM_MODEL_NAME: saluki-27b
      IMAGE_GENERATION_MODEL: Qwen-Image-2.1-Turbo
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8330/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
