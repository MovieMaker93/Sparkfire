# Web search for chat: a SearXNG instance only the app queries, over the compose network. It is part of the
# stack, so start-dgx-spark.sh always adds this file and starts it.
# Searching sends what a conversation is about to the search engines SearXNG queries (Google, Bing, ...),
# without the user's identity. New conversations start with web search on; each can turn it off.

services:
  app:
    environment:
      WEB_SEARCH_BASE_URL: http://searxng:8080

  searxng:
    image: searxng/searxng:2026.10.4-d48c4b555@sha256:76b0bf285aca014c7191fc4d9234c4bfb358624ac33d8883833d496c059ec072
    container_name: sparkfire-searxng
    restart: unless-stopped
    # Only on this host, for checks with curl; the app reaches it as http://searxng:8080.
    ports:
      - "127.0.0.1:8338:8080"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      # Generated once by start-dgx-spark.sh into data/searxng/secret.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
      # The settings are mounted read-only; do not try to take ownership of them.
      FORCE_OWNERSHIP: "false"
    volumes:
      - ./services/searxng:/etc/searxng:ro
    tmpfs:
      - /var/cache/searxng:size=64m
      - /tmp:size=16m
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "/usr/local/searxng/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
