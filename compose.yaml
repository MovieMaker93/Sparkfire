services:
  app:
    build: .
    ports:
      - "${SPARKFIRE_PORT:-54321}:54321"
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      REDIS_URL: redis://redis:6379
      PORT: "54321"
      DATA_DIR: /data
      WORKER_ENABLED: "true"
      # Where the stack's services run. Their models are fixed by the app (docs/fork.md), so there are no model
      # names or keys to set here.
      SYSTEM_STATUS_BASE_URL: ${SYSTEM_STATUS_BASE_URL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      OCR_BASE_URL: ${OCR_BASE_URL:-}
      STT_BASE_URL: ${STT_BASE_URL:-}
      TRANSLATION_BASE_URL: ${TRANSLATION_BASE_URL:-}
      IMAGE_GENERATION_BASE_URL: ${IMAGE_GENERATION_BASE_URL:-}
      VIDEO_GENERATION_BASE_URL: ${VIDEO_GENERATION_BASE_URL:-}
      MUSIC_GENERATION_BASE_URL: ${MUSIC_GENERATION_BASE_URL:-}
      WEB_SEARCH_BASE_URL: ${WEB_SEARCH_BASE_URL:-}
      SPARKFIRE_SETUP_COMPLETE: ${SPARKFIRE_SETUP_COMPLETE:-}
      SPARKFIRE_DEPLOYMENT_MODE: ${SPARKFIRE_DEPLOYMENT_MODE:-custom}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped
volumes:
  redis-data:
