# Sparkfire's stack for a 128 GB NVIDIA DGX Spark. Its models are fixed, chosen and measured to share the
# Spark's memory (docs/validation.md): Saluki 27B for chat, PaddleOCR-VL-1.6, Parakeet, Hy-MT2,
# Qwen-Image-2.1-Turbo, FastH3 and YuE2, plus SearXNG for web search (compose.search.yaml).
# Use through scripts/start-dgx-spark.sh so the memory-heavy services start
# sequentially and are checked for readiness before the next model is loaded.
# There is no grounding service (the module stays out of the app).

services:
  app:
    environment:
      SYSTEM_STATUS_BASE_URL: http://host.docker.internal:8330
      LLM_BASE_URL: http://host.docker.internal:8331/v1
      OCR_BASE_URL: http://host.docker.internal:8332/v1
      STT_BASE_URL: http://host.docker.internal:8333/v1
      TRANSLATION_BASE_URL: http://host.docker.internal:8334/v1
      IMAGE_GENERATION_BASE_URL: http://host.docker.internal:8336/v1
      # start-dgx-spark.sh --video-backend none sets this empty, so the endpoint is not configured.
      VIDEO_GENERATION_BASE_URL: ${SPARKFIRE_VIDEO_BASE_URL-${SPARKLINGKIT_VIDEO_BASE_URL-http://host.docker.internal:8337/v1}}
      MUSIC_GENERATION_BASE_URL: http://host.docker.internal:8339/v1
      SPARKFIRE_SETUP_COMPLETE: "true"
      SPARKFIRE_DEPLOYMENT_MODE: all-in-one

  model-downloader:
    profiles: [tools]
    build:
      context: ./services/dgx-models/downloader
    image: sparklingkit/model-downloader:0.1.0
    environment:
      HF_HOME: /tmp/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./data/dgx-models:/models

  # Chat LLM on :8331: Underdog Saluki 27B, a 2-bit GGUF of Qwen3.8-27B with its vision add-on, in llama.cpp's
  # llama-server. About 13 GiB on the GPU with the 64k context, loaded in seconds with no peak
  # (docs/validation.md). --jinja gives it tool calls for web search, --mmproj image input. These are the flags
  # its memory was measured with; the alias is the model id the app asks for.
  saluki:
    build:
      context: ./services/dgx-models/llama-server
    image: sparklingkit/llama-server:b11576
    container_name: sparklingkit-saluki
    restart: unless-stopped
    network_mode: host
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      PORT: "8331"
    volumes:
      - ./data/dgx-models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - --model
      - /models/ConwayResearch/Underdog-Saluki-27B-1.0/Underdog-Saluki-27B-1.0-IQ2-mix.gguf
      - --mmproj
      - /models/ConwayResearch/Underdog-Saluki-27B-1.0/mmproj-Underdog-Saluki-27B-1.0-F16.gguf
      - --alias
      - saluki-27b
      - --jinja
      - -ngl
      - "99"
      - -fa
      - "on"
      - -c
      - "65536"
      - --parallel
      - "1"
      - --host
      - 0.0.0.0
      - --port
      - "8331"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8331/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 2m

  # ASR backend. The adapter on :8333 starts parakeet.cpp's parakeet-server on 127.0.0.1:8343,
  # which serves one request at a time.
  parakeet:
    build:
      context: ./services/dgx-models/parakeet
    image: sparklingkit/parakeet:parakeet.cpp-v0.5.0
    container_name: sparklingkit-parakeet
    restart: unless-stopped
    network_mode: host
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      MODEL_PATH: /models/mudler/parakeet-cpp-gguf/tdt-0.6b-v3-f16.gguf
      MODEL_NAME: Parakeet-TDT-0.6B-v3
      PORT: "8333"
      ENGINE_PORT: "8343"
    volumes:
      - ./data/dgx-models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8333/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 80
      start_period: 1m

  # OCR on :8332: PaddleOCR-VL-1.6. The adapter runs PP-DocLayout on CPU and sends each detected element to
  # the VLM below, which listens on a private port.
  paddleocr-vlm:
    image: vllm/vllm-openai:v0.24.0@sha256:251eba5cc7c12fed0b75da22a9240e582b1c9e39f6fbc064f86781b963bd814f
    container_name: sparklingkit-paddleocr-vlm
    restart: unless-stopped
    network_mode: host
    ipc: host
    shm_size: "8gb"
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./data/dgx-models/PaddlePaddle/PaddleOCR-VL-1.6:/model:ro
      - ./data/dgx-runtime/paddleocr-vlm:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint: ["vllm", "serve"]
    command:
      - /model
      - --served-model-name
      - PaddleOCR-VL-1.6
      - --host
      - 127.0.0.1
      - --port
      - "8342"
      - --trust-remote-code
      - --max-num-batched-tokens
      - "16384"
      - --max-num-seqs
      - ${PADDLE_MAX_NUM_SEQS:-8}
      - --kv-cache-memory-bytes
      - ${PADDLE_KV_CACHE_MEMORY_BYTES:-3G}
      - --gpu-memory-utilization
      - ${PADDLE_GPU_MEMORY_UTILIZATION:-0.06}
      - --no-enable-prefix-caching
      - --mm-processor-cache-gb
      - "0"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8342/v1/models >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 120
      start_period: 3m

  paddleocr-vl:
    build:
      context: ./services/dgx-models/paddleocr-vl
    image: sparklingkit/paddleocr-vl-adapter:paddleocr-3.7.0
    container_name: sparklingkit-paddleocr-vl
    restart: unless-stopped
    network_mode: host
    environment:
      MODEL_NAME: PaddleOCR-VL-1.6
      VLM_URL: http://127.0.0.1:8342/v1
      VLM_MODEL_NAME: PaddleOCR-VL-1.6
      LAYOUT_DEVICE: ${PADDLE_LAYOUT_DEVICE:-cpu}
      PORT: "8332"
    volumes:
      - ./data/dgx-runtime/paddleocr-vl:/root/.cache
    depends_on:
      paddleocr-vlm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8332/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 80
      start_period: 3m

  hy-mt2:
    build:
      context: ./services/dgx-models/hy-mt2
    image: sparklingkit/hy-mt2-1.8b-fp8:transformers-5.6.0
    container_name: sparklingkit-hy-mt2
    restart: unless-stopped
    network_mode: host
    ipc: host
    shm_size: "16gb"
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      MODEL_PATH: /models/tencent/Hy-MT2-1.8B-FP8
      MODEL_NAME: Hy-MT2-1.8B-FP8
      PORT: "8334"
      MAX_NEW_TOKENS: ${HY_MAX_NEW_TOKENS:-4096}
    volumes:
      - ./data/dgx-models:/models:ro
      - ./data/dgx-runtime/hy-mt2:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8334/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 120
      start_period: 3m

  # Image generation on :8336: Qwen-Image-2.1-Turbo (Qwen-Image 2.1 distilled to 8 steps, float8 weights, a
  # 34 GB cap). The service keeps the name z-image from when Z-Image-Turbo was the model, so compose still owns
  # the container of existing installs. Model path, steps and sizes follow the backend.
  z-image:
    build:
      context: ./services/dgx-models/image-generation
    image: sparklingkit/image-generation:diffusers-0.41.0
    container_name: sparklingkit-image-generation
    restart: unless-stopped
    network_mode: host
    ipc: host
    shm_size: "16gb"
    mem_limit: ${IMAGE_MEM_LIMIT:-34g}
    memswap_limit: ${IMAGE_MEM_LIMIT:-34g}
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      IMAGE_BACKEND: qwen-image-2.1-turbo
      PORT: "8336"
      # Empty uses the backend's own default (SDPA for Qwen-Image).
      ATTENTION_BACKEND: ${IMAGE_ATTENTION_BACKEND:-}
      DEFAULT_STEPS: ${IMAGE_DEFAULT_STEPS:-}
      MAX_PIXELS: ${IMAGE_MAX_PIXELS:-}
      QUANTIZE: ${IMAGE_QUANTIZE:-}
    volumes:
      - ./data/dgx-models:/models:ro
      - ./data/dgx-outputs/images:/outputs
      - ./data/dgx-runtime/z-image:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8336/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 160
      start_period: 8m

  # Video generation on :8337: FastH3 (MiniMax H3, video with sound) through a pinned ComfyUI that the adapter
  # starts on 127.0.0.1:8347. Nothing loads at start; the weights load on the first job (+32-35 GiB measured
  # for Fast) and are freed after VIDEO_IDLE_UNLOAD_SECONDS without a job. The cap bounds host-side memory
  # (staging weights while loading); GPU allocations are not charged to it, as the image service's
  # 1.8 GiB-of-34 GiB reading with 17.9 GB on the GPU shows. The MiniMax H3 Community License does not cover
  # the EU, the UK, South Korea or the US; start-dgx-spark.sh --video-backend none leaves this service out.
  video-generation:
    build:
      context: ./services/dgx-models/video
    image: sparklingkit/video-generation:comfyui-0df64eb
    container_name: sparklingkit-video-generation
    restart: unless-stopped
    network_mode: host
    ipc: host
    shm_size: "16gb"
    mem_limit: ${VIDEO_MEM_LIMIT:-56g}
    memswap_limit: ${VIDEO_MEM_LIMIT:-56g}
    environment:
      HF_HUB_OFFLINE: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      VIDEO_BACKEND: fasth3
      MODEL_NAME: FastH3
      PORT: "8337"
      COMFY_PORT: "8347"
      IDLE_UNLOAD_SECONDS: ${VIDEO_IDLE_UNLOAD_SECONDS:-600}
    volumes:
      - ./data/dgx-models:/models:ro
      - ./data/dgx-runtime/video:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8337/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 3m

  # Music generation on :8339: YuE2 (m-a-p), lyrics and a style in, a 48 kHz stereo song with vocals and its
  # ABC score out. The weights are CC BY-NC 4.0 with a creator permission. Nothing loads at start. A song loads about
  # 15 GiB, since the adapter keeps the model and its decoder on the GPU (on the Spark's shared memory that
  # saves a minute a song), and peaks near 20 GiB. The adapter refuses to load with less than 22 GiB free and
  # frees the weights after MUSIC_IDLE_UNLOAD_SECONDS without a song.
  music-generation:
    build:
      context: ./services/dgx-models/music
    image: sparklingkit/music-generation:yue2-9c6c4b3
    container_name: sparklingkit-music-generation
    restart: unless-stopped
    network_mode: host
    ipc: host
    mem_limit: ${MUSIC_MEM_LIMIT:-32g}
    memswap_limit: ${MUSIC_MEM_LIMIT:-32g}
    environment:
      HF_HUB_OFFLINE: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      MUSIC_BACKEND: yue2
      MODEL_NAME: YuE2-3B
      PORT: "8339"
      IDLE_UNLOAD_SECONDS: ${MUSIC_IDLE_UNLOAD_SECONDS:-600}
    volumes:
      - ./data/dgx-models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8339/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 1m
